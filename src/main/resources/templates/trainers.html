<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{base}">

<head>
    <title>Available Trainers</title>
</head>

<body>

<header layout:fragment="header">
    <h1>Fit Track <small>/ Trainers</small></h1>
</header>

<section layout:fragment="main">

    <h3>Available Trainers</h3>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Specialization</th>
            <th>Area</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="trainer : ${trainers}">
            <td th:text="${trainer.firstName()} + ' ' + ${trainer.lastName()}"></td>
            <td th:text="${trainer.emailAddress()}"></td>

            <!-- προσωρινά placeholders -->
            <td>General Fitness</td>
            <td>Athens</td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Back to homepage</a>
    </div>

</section>

</body>
</html>
