<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org/"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{base}">

<head>
    <title>Trainer Notes</title>
</head>

<body>

<header layout:fragment="header">
    <h1>
        Fit Track
        <small>/ Profile / Training Notes & Plans</small>
    </h1>
</header>

<section layout:fragment="main">

    <h2>Training Sessions</h2>

    <div th:if="${appointments.isEmpty()}">
        <p>No approved appointments yet.</p>
    </div>

    <div th:each="appt : ${appointments}"
         style="border:1px solid #ccc; padding:15px; margin-bottom:20px;">

        <h4>
            Client:
            <span th:text="${appt.customer.firstName + ' ' + appt.customer.lastName}"></span>
        </h4>

        <p>
            <strong>Date:</strong>
            <span th:text="${#temporals.format(appt.startDateTime, 'dd/MM/yyyy HH:mm')}"></span>
            –
            <span th:text="${#temporals.format(appt.endDateTime, 'HH:mm')}"></span>
        </p>

        >
        <!-- ===================== -->
        <!-- ΥΠΑΡΧΕΙ SESSION -->
        <!-- ===================== -->
        <div th:if="${appt.trainingSession != null}">

            <h5>Notes</h5>
            <p th:text="${appt.trainingSession.notes}"></p>

            <h5>Training Plan</h5>
            <p th:text="${appt.trainingSession.trainingPlan}"></p>

            <p>
                <em>Status:</em>
                <span th:text="${appt.trainingSession.status}"></span>
            </p>
        </div>

        <!-- ===================== -->
        <!-- ΔΕΝ ΥΠΑΡΧΕΙ SESSION -->
        <!-- ===================== -->
        <div th:if="${appt.trainingSession == null}">

            <form th:action="@{/trainer/notes/{id}(id=${appt.id})}"
                  method="post">

                <div>
                    <label><strong>Notes</strong></label><br/>
                    <textarea name="notes"
                              rows="4"
                              cols="60"
                              required></textarea>
                </div>

                <br/>

                <div>
                    <label><strong>Training Plan</strong></label><br/>
                    <textarea name="trainingPlan"
                              rows="6"
                              cols="60"
                              required></textarea>
                </div>

                <br/>

                <button type="submit">
                    Save Session
                </button>
            </form>
        </div>

    </div>

    <a th:href="@{/profile}">← Back to Profile</a>

</section>

</body>
</html>
