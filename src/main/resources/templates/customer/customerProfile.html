<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{base}">

<head>
    <title>Manage Profile</title>
</head>
<body>
<header layout:fragment="header">
    <h1>
        Fit Track
        <small>/ Profile / Manage Profile</small>
    </h1>
</header>

<section layout:fragment="main">

    <h2>Manage Profile</h2>

    <form th:action="@{/customer/customerProfile}" method="post">

        <label>Fitness goal</label>
        <select name="goal">
            <option th:each="g : ${goals}"
                    th:value="${g}"
                    th:text="${g}"
                    th:selected="${g == profile.goal}">
            </option>
        </select>

        <br/><br/>

        <label>Notes</label><br/>
        <textarea name="notes"
                  rows="5"
                  cols="50"
                  th:text="${profile.notes}">
        </textarea>

        <br/><br/>

        <button type="submit">Save profile</button>
    </form>

    </section>
</body>
</html>
