<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{base}">

<head>
    <title>Book Appointment</title>
</head>

<body>

<header layout:fragment="header">
    <h1>
        Fit Track
        <small>/ Customer / Book Appointment</small>
    </h1>
</header>

<section layout:fragment="main">

    <h2>Book a Training Session</h2>

    <div th:if="${weather != null}" class="mb-3">
        <p>
            <strong>Weather forecast for</strong>
            <strong th:text="${#temporals.format(selectedDate, 'dd MMM yyyy', T(java.util.Locale).ENGLISH)}"></strong>
            <br/>

            <strong th:text="${weather.city}"></strong><br/>
            <span th:text="${weather.conditions}"></span><br/>

            Temperature:
            <span th:text="${weather.temperatureCelsius}"></span> °C
            <br/>
            Humidity:
            <span th:text="${weather.humidityPercent}"></span> %
        </p>
    </div>

    <form th:action="@{/customer/book}" method="get">

        <div class="mb-3">
            <label><strong>Select Trainer</strong></label><br/>
            <select name="trainerId" required>
                <option value="">-- choose trainer --</option>
                <option th:each="t : ${trainers}"
                        th:value="${t.id}"
                        th:text="${t.firstName + ' ' + t.lastName}"
                        th:selected="${t.id == selectedTrainerId}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label><strong>Select Date</strong></label><br/>
            <input type="date"
                   name="date"
                   th:value="${selectedDate}"
                   required/>
        </div>

        <button type="submit">Check Availability</button>
    </form>

    <div th:if="${availabilities != null}">

        <h3>Available Time Slots</h3>

        <div th:if="${#lists.isEmpty(availabilities)}">
            <p><em>No availability for selected trainer & date.</em></p>
        </div>

        <div th:each="a : ${availabilities}"
             style="border:1px solid #ccc; padding:10px; margin-bottom:10px">

            <p>
                <strong>
                    <span th:text="${#temporals.format(a.startTime, 'HH:mm')}"></span>
                    -
                    <span th:text="${#temporals.format(a.endTime, 'HH:mm')}"></span>
                </strong>
            </p>

            <form th:action="@{/customer/book}" method="post">

                <input type="hidden" name="trainerId" th:value="${a.trainerId}"/>
                <input type="hidden" name="startDateTime" th:value="${a.startTime}"/>
                <input type="hidden" name="endDateTime" th:value="${a.endTime}"/>

                <button type="submit">Book this slot</button>
            </form>
        </div>
    </div>

    <hr/>

    <br/>

    <a th:href="@{/profile}">← Back to Profile</a>

</section>

</body>
</html>
