spring:
  application:
    name: Fit Track

  datasource:
    url: jdbc:h2:file:./LOCAL_DATA/h2/app;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: changeme
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
      hibernate.format_sql: trues


  # Custom Application Properties
app:
  jwt:
    issuer: "fit-track-api"
    audience: "fit-track-clients"
    secret: "${JWT_SECRET:+U4BixW9hDLYU5WOC+3OvutSpIrYVcF/QkDcJ4zq5sM=}" # openssl rand -base64 32
    ttl-minutes: 60
